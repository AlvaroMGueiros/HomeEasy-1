<app-navbar [authenticated]="true" [userId]="userId" (logout)="logout()"></app-navbar><main class="app-page"><div class="page-shell"><header class="page-heading"><span class="pageEmblem"><app-page-icon name="shield"></app-page-icon></span><div><h1>Moderação de publicações</h1></div></header><app-loading-state *ngIf="isLoading" message="Carregando fila..."></app-loading-state><app-action-feedback type="error" [message]="error"></app-action-feedback><button class="button-secondary" *ngIf="error" (click)="load()">Tentar novamente</button><div class="form-stack"><article class="section-card" *ngFor="let publication of publications"><h2>{{ publication.title }}</h2><p>{{ publication.professionalName }}</p><p>{{ publication.description }}</p><div class="reviewImageGrid"><a *ngFor="let mediaId of publication.mediaIds" [href]="mediaUrl(mediaId)" target="_blank" rel="noopener noreferrer"><img [src]="mediaUrl(mediaId)" alt="Foto enviada para análise" loading="lazy"></a></div><label>Observação<textarea [(ngModel)]="notes[publication.id]" maxlength="2000" [disabled]="isSaving"></textarea><app-character-count [value]="notes[publication.id]" [minimum]="0" [maximum]="2000"></app-character-count></label><div class="form-actions"><button class="button-primary" [disabled]="isSaving" (click)="review(publication.id, statuses.Approved)">Aprovar</button><button class="button-danger" [disabled]="isSaving" (click)="review(publication.id, statuses.Rejected)">Rejeitar</button></div></article></div><section class="empty-state" *ngIf="!isLoading && !error && !publications.length"><div class="empty-state-content"><h2>Nenhuma publicação pendente</h2><p>As novas publicações enviadas para aprovação aparecerão aqui.</p></div></section></div></main>
