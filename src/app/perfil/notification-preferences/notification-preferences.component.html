<app-navbar [authenticated]="true" [userId]="userId" (logout)="logout()"></app-navbar><main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><span class="pageEmblem"><app-page-icon name="bell"></app-page-icon></span><div class="page-heading-copy"><h1>Preferências de notificações</h1></div></header><app-loading-state *ngIf="isLoading" message="Carregando preferências..."></app-loading-state><app-action-feedback type="error" [message]="error"></app-action-feedback><app-action-feedback type="success" [message]="feedback"></app-action-feedback><button *ngIf="error && !preferences" class="button-secondary" (click)="load()">Tentar novamente</button><form *ngIf="preferences" class="surface-card form-stack" (ngSubmit)="save()"><label class="preferenceRow" *ngFor="let preference of labels"><input class="switchControl" role="switch" type="checkbox" [name]="preference.key" [(ngModel)]="preferences[preference.key]" [disabled]="isSaving"> {{ preference.label }}</label><p>Estas preferências também valem para o aplicativo. O histórico permanece disponível.</p><button class="button-primary" [disabled]="isSaving">Salvar preferências</button></form></div></main>
