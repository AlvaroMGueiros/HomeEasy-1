<app-navbar [authenticated]="true" [userId]="userId" (logout)="logout()"></app-navbar><main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><span class="pageEmblem"><app-page-icon name="bell"></app-page-icon></span><div class="page-heading-copy"><h1>Notificações</h1></div><div class="form-actions"><button class="button-secondary" *ngIf="hasUnread" [disabled]="isSaving" (click)="markAll()">Marcar todas como lidas</button><a class="button-quiet" routerLink="/preferencias-notificacoes">Preferências</a></div></header><app-loading-state *ngIf="isLoading" message="Carregando notificações..."></app-loading-state><app-action-feedback type="error" [message]="error"></app-action-feedback><button class="button-secondary" *ngIf="error" (click)="load()">Tentar novamente</button><div class="form-stack" *ngIf="!isLoading && !error"><button class="section-card text-start notificationRow" [class.notificationUnread]="!notification.readAt" *ngFor="let notification of notifications" [disabled]="isSaving" (click)="open(notification)"><span class="sectionEmblem"><app-page-icon name="bell"></app-page-icon></span><strong>{{ notification.title }}</strong><p>{{ notification.body }}</p><small>{{ notification.createdAt | date:'dd/MM/yyyy' }}{{ notification.readAt ? '' : ' (nova)' }}</small></button><p *ngIf="!notifications.length">Nenhuma notificação por enquanto.</p></div></div></main>
