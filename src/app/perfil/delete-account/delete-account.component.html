<app-navbar [authenticated]="true" [userId]="userId" (logout)="logout()"></app-navbar><main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><span class="pageEmblem"><app-page-icon name="shield"></app-page-icon></span><div class="page-heading-copy"><h1>Excluir minha conta</h1></div></header><section class="surface-card form-stack"><p>Seu acesso será revogado. Dados pessoais, documentos, fotos e anexos serão apagados ou anonimizados.</p><p>Registros necessários para segurança, disputas ou obrigações legais poderão ser mantidos com acesso restrito.</p><app-action-feedback type="error" [message]="error"></app-action-feedback><label>Digite EXCLUIR para confirmar<input [(ngModel)]="confirmation" autocomplete="off" [disabled]="isSaving"></label><button class="button-danger" [disabled]="!canDelete || isSaving" (click)="showConfirmation = true">Excluir minha conta</button><a class="button-secondary" [routerLink]="['/usuario', userId]">Voltar ao perfil</a></section></div></main><app-dialog [open]="showConfirmation" title="Excluir conta permanentemente?" message="Seu acesso será encerrado e esta ação não poderá ser desfeita." [confirmation]="true" [dangerAction]="true" [loading]="isSaving" confirmLabel="Excluir conta" (confirm)="deleteAccount()" (cancel)="showConfirmation = false"></app-dialog>
