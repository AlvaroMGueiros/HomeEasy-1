<app-navbar [authenticated]="entrarSair" [userId]="userId" (logout)="sair()"></app-navbar>
<main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><div class="page-heading-copy"><span class="page-kicker">Acesso</span><h1>Recupere sua senha.</h1><p>Informe o e-mail da sua conta para receber o link de recuperação.</p></div></header><form class="surface-card form-stack" #recoveryForm="ngForm" (ngSubmit)="resetPassword()"><div class="field-group"><label for="recoveryEmail">E-mail</label><input id="recoveryEmail" type="email" placeholder="voce@exemplo.com" [(ngModel)]="userLogin.email" name="email" required email autocomplete="email" #email="ngModel"><span class="field-error" *ngIf="!email.valid && email.touched">Informe um e-mail válido.</span></div><app-action-feedback [message]="feedbackMessage" [type]="feedbackType"></app-action-feedback><div class="form-actions"><button class="button-primary" type="submit" [disabled]="!recoveryForm.valid || isSubmitting">{{ isSubmitting ? 'Enviando...' : 'Enviar link' }}</button><a class="button-secondary" routerLink="/login">Voltar ao login</a></div></form></div></main>
