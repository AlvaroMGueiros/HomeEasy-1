<app-navbar [authenticated]="true" [userId]="userId" (logout)="logout()"></app-navbar><main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><span class="pageEmblem"><app-page-icon name="shield"></app-page-icon></span><div><span class="page-kicker">Administração</span><h1>Moderação e suporte</h1></div></header><div class="form-actions"><a class="button-secondary" routerLink="/admin/verificacoes">Documentos e métricas</a><a class="button-secondary" routerLink="/admin/publicacoes">Publicações</a></div><app-loading-state *ngIf="isLoading" message="Carregando casos..."></app-loading-state><app-action-feedback type="error" [message]="error"></app-action-feedback><button class="button-secondary" *ngIf="error" (click)="load()">Tentar novamente</button><ng-container *ngIf="queue && !isLoading"><section *ngFor="let group of groups"><h2>{{ group.title }}</h2><div class="form-stack"><article class="section-card" *ngFor="let moderationCase of queue[group.type]"><p>{{ moderationCase.description }}</p><label>Resposta ou observações<textarea [(ngModel)]="notes[moderationCase.id]" maxlength="2000" [disabled]="isSaving"></textarea><app-character-count [value]="notes[moderationCase.id]" [minimum]="0" [maximum]="2000"></app-character-count></label><div class="form-actions"><button class="button-primary" [disabled]="isSaving" (click)="review(group.type, moderationCase.id, statuses.Resolved)">Marcar como resolvido</button><button class="button-secondary" [disabled]="isSaving" (click)="review(group.type, moderationCase.id, statuses.Rejected)">Encerrar sem procedência</button></div></article><p *ngIf="!queue[group.type].length">Nenhum caso pendente.</p></div></section></ng-container></div></main>
