<app-navbar [authenticated]="entrarSair" [userId]="userId" (logout)="sair()"></app-navbar>
<main class="app-page"><div class="page-shell"><header class="page-heading"><div class="page-heading-copy"><span class="page-kicker">Painel profissional</span><h1>Pedidos recebidos</h1><p>Veja novas solicitações e responda aos seus clientes.</p></div></header>
  <app-loading-state *ngIf="isLoading" message="Carregando solicitações..."></app-loading-state>
  <section class="entity-grid" *ngIf="!isLoading && pedidosRecebidosArray.length != 0"><article class="entity-card" *ngFor="let serve of pedidosRecebidosArray"><span class="icon-badge">PR</span><h2>{{ serve.nome }}</h2><p>{{ serve.data }} · {{ serve.cidade }}</p><div class="card-actions"><a class="button-primary" [routerLink]="['/usuario', serve.idContratante, 'pedidos-recebidos', serve.id]">Analisar pedido</a></div></article></section>
  <section class="empty-state" *ngIf="!isLoading && pedidosRecebidosArray.length == 0"><div class="empty-state-content"><span class="icon-badge">0</span><h2>Nenhuma solicitação nova</h2><p>Quando um cliente solicitar um dos seus serviços, o pedido aparecerá aqui.</p></div></section>
</div></main>
