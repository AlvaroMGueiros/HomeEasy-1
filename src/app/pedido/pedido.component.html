<app-navbar [authenticated]="entrarSair" [userId]="userId" (logout)="sair()"></app-navbar>
<div class="context-nav"><app-back-link [route]="['/serviço', serveID, 'usuario', usuarioID]" label="Voltar ao profissional"></app-back-link></div>
<main class="app-page"><div class="page-shell"><header class="page-heading"><div class="page-heading-copy"><span class="page-kicker">Novo pedido</span><h1>Agende seu serviço.</h1><p>Revise a escolha e informe quando e onde o atendimento deve acontecer.</p></div></header>
  <div class="content-grid"><aside class="surface-card"><span class="page-kicker">Resumo</span><h2>{{ serve.nome }}</h2><div class="detail-list"><div class="detail-item"><span>Profissional</span><strong>{{ servidor.nome }}</strong></div><div class="detail-item"><span>Valor</span><strong>R$ {{ servePedido.preco }}</strong></div></div></aside>
    <form class="surface-card form-stack" #f="ngForm" (ngSubmit)="addpedido()"><div class="form-grid"><div class="field-group"><label for="orderDate">Data</label><input id="orderDate" type="date" name="data" [min]="today" [(ngModel)]="pedido.data" required><span class="field-error" *ngIf="pedido.data < today">Escolha uma data futura.</span></div><div class="field-group"><label for="orderTime">Horário</label><input id="orderTime" type="time" name="hora" [(ngModel)]="pedido.hora" required></div><div class="field-group field-group-full"><label for="orderAddress">Endereço do atendimento</label><input id="orderAddress" type="text" name="local" [(ngModel)]="pedido.local" required placeholder="Rua, número e complemento"></div><div class="field-group"><label for="orderCity">Cidade</label><input id="orderCity" type="text" name="cidade" [(ngModel)]="pedido.cidade" required></div><div class="field-group"><label for="orderState">Estado</label><select id="orderState" [(ngModel)]="pedido.estado" name="estado" required><option>Pernambuco</option></select></div></div><app-action-feedback [message]="feedbackMessage" [type]="feedbackType"></app-action-feedback><div class="form-actions"><button class="button-primary" type="submit" [disabled]="!f.valid || pedido.data < today || isSubmitting">{{ isSubmitting ? 'Confirmando...' : 'Confirmar pedido' }}</button></div></form>
  </div>
</div></main>
