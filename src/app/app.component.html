<router-outlet></router-outlet>
<app-community-rules-gate [userId]="(sessionService.user$ | async)?.id || ''"></app-community-rules-gate>

<ng-container *ngIf="notificationService.state$ | async as notification">
  <app-dialog
    [open]="notification.open"
    [title]="notification.title"
    [message]="notification.message"
    [type]="notification.type"
    (confirm)="closeNotification()"
    (cancel)="closeNotification()">
  </app-dialog>
</ng-container>
