<app-navbar [authenticated]="entrarSair" [userId]="userId" (logout)="sair()"></app-navbar>
<main class="chat-page"><section class="chat-shell">
  <header class="chat-header"><div class="chat-person"><span class="chat-avatar" *ngIf="!servidor.foto">{{ servidor.nome ? servidor.nome.charAt(0) : 'HE' }}</span><img class="chat-avatar" *ngIf="servidor.foto" [src]="servidor.foto" [alt]="servidor.nome"><div><span>Conversando com</span><strong>{{ servidor.nome }}</strong></div></div><a class="button-secondary" routerLink="/conversas">Todas as conversas</a></header>
  <div class="message-list" aria-live="polite"><div *ngFor="let msg of mensagensArray"><article class="message message-received" *ngIf="msg.id == servidor.id"><div class="message-content"><p>{{ msg.mensagem }}</p><time>{{ msg.hora }}</time></div></article><article class="message message-sent" *ngIf="msg.id !== servidor.id"><div class="message-content"><p>{{ msg.mensagem }}</p><time>{{ msg.hora }}</time></div></article></div></div>
  <app-action-feedback [message]="feedbackMessage" [type]="feedbackType"></app-action-feedback>
  <form class="message-form" #f="ngForm" (ngSubmit)="enviarMensagem()"><label class="sr-only" for="newMessage">Nova mensagem</label><input id="newMessage" type="text" placeholder="Digite uma mensagem..." [(ngModel)]="mensagem.mensagem" name="mensagem" required autocomplete="off"><button class="button-primary" type="submit" [disabled]="!f.valid || isSending">{{ isSending ? 'Enviando...' : 'Enviar' }}</button></form>
</section></main>
