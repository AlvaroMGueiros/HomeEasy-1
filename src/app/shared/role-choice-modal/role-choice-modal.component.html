<div class="roleBackdrop" (click)="close()"></div>
<section class="roleModal" role="dialog" aria-modal="true" aria-labelledby="roleTitle" aria-describedby="roleText">
  <button class="roleClose" type="button" (click)="close()" aria-label="Fechar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
  </button>

  <div class="roleArt" aria-hidden="true">
    <span class="roleArtRing"></span>
    <img src="assets/brand/homeeasy-symbol.svg" alt="">
  </div>

  <h2 id="roleTitle">Como você vai usar a HomeEasy?</h2>
  <p id="roleText">Assim levamos você direto para a parte da plataforma que faz sentido para você.</p>

  <div class="roleActions">
    <button #firstAction class="roleOption roleOptionPrimary" type="button" (click)="pick('provider')">Quero oferecer meus serviços</button>
    <button class="roleOption" type="button" (click)="pick('client')">Preciso contratar um serviço</button>
  </div>
</section>
