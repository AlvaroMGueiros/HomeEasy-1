<details class="section-card" [open]="expanded" (toggle)="onToggle($event)"><summary>Segurança e denúncia</summary><app-action-feedback type="error" [message]="error"></app-action-feedback><app-action-feedback type="success" [message]="feedback"></app-action-feedback><p *ngIf="messageId">Sua denúncia será vinculada à mensagem selecionada.</p><form class="form-stack" #reportForm="ngForm" (ngSubmit)="report()"><label>Motivo<select name="category" [(ngModel)]="category" [disabled]="isSaving"><option *ngFor="let category of categories" [ngValue]="category.value">{{ category.label }}</option></select></label><label>Descreva o problema<textarea name="description" [(ngModel)]="description" required minlength="20" maxlength="2000" [disabled]="isSaving"></textarea><app-character-count [value]="description" [minimum]="20" [maximum]="2000"></app-character-count></label><button class="button-secondary" [disabled]="isSaving || reportForm.invalid">Enviar denúncia</button></form><button class="button-danger" type="button" *ngIf="targetUserId" [disabled]="isSaving" (click)="showConfirmation = true">{{ isBlocked ? 'Desbloquear pessoa' : 'Bloquear pessoa' }}</button></details><app-dialog [open]="showConfirmation" [title]="isBlocked ? 'Desbloquear pessoa?' : 'Bloquear pessoa?'" message="O histórico do atendimento será mantido. O bloqueio não cancela serviços." [confirmation]="true" [dangerAction]="!isBlocked" [loading]="isSaving" [confirmLabel]="isBlocked ? 'Desbloquear' : 'Bloquear'" (confirm)="toggleBlock()" (cancel)="showConfirmation = false"></app-dialog>
