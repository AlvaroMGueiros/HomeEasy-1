<app-navbar [authenticated]="true" [userId]="userId" (logout)="logout()"></app-navbar><main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><span class="pageEmblem"><app-page-icon name="shield"></app-page-icon></span><div class="page-heading-copy"><h1>Confirmar documentos</h1></div></header><p>Documentos privados, acessíveis apenas à equipe responsável pela análise.</p><app-loading-state *ngIf="isLoading" message="Carregando documentos..."></app-loading-state><app-action-feedback type="error" [message]="error"></app-action-feedback><app-action-feedback type="success" [message]="feedback"></app-action-feedback><button class="button-secondary" *ngIf="error" (click)="load()">Atualizar documentos</button><form class="section-card form-stack" (ngSubmit)="submit(documentFile)"><label>Tipo de documento<select name="documentType" [(ngModel)]="documentType" [disabled]="isSaving"><option *ngFor="let documentType of documentTypes" [ngValue]="documentType.value">{{ documentType.label }}</option></select></label><label>Arquivo<input #documentFile type="file" accept="application/pdf,image/png,image/jpeg,image/webp" [disabled]="isSaving" (change)="selectFile($event)"></label><button class="button-primary" [disabled]="isSaving || !selectedFile">Enviar documento</button></form><div class="form-stack"><article class="section-card" *ngFor="let document of documents"><h2>{{ label(document.type) }}</h2><p>{{ statusLabels[document.status] || document.status }}</p><p>{{ document.reviewNotes }}</p><small>{{ document.createdAt | date:'dd/MM/yyyy' }}</small></article></div><p *ngIf="!isLoading && !error && !documents.length">Nenhum documento enviado.</p></div></main>
