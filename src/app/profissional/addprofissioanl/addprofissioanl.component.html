<app-navbar [authenticated]="entrarSair" [userId]="userId" (logout)="sair()"></app-navbar>
<main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><div class="page-heading-copy"><span class="page-kicker">Trabalhe com a Home Easy</span><h1>Cadastre um serviço.</h1><p>Informe sua especialidade, valor e o que está incluído no atendimento.</p></div></header>
  <form class="surface-card form-stack" #f="ngForm">
    <div class="field-group"><label for="professionalService">Serviço</label><select id="professionalService" name="serve" [(ngModel)]="servicoSelecionado" required><option [ngValue]="undefined" disabled>Selecione uma opção</option><option *ngFor="let serve of servicosArray" [ngValue]="serve">{{ serve.nome }}</option></select></div>
    <div class="field-group"><label for="professionalPrice">Valor do serviço</label><input id="professionalPrice" type="number" name="preco" [(ngModel)]="servePedido.preco" required pattern="[0-9]+([\.,][0-9]+)?" #rateInput2="ngModel" placeholder="R$ 0,00"><span class="field-help">Informe o valor-base que você pretende cobrar.</span><span class="field-error" *ngIf="rateInput2.errors && rateInput2.touched">Informe um valor válido.</span></div>
    <div class="field-group"><label for="professionalDetails">Descrição</label><textarea id="professionalDetails" name="detalhe" placeholder="Descreva sua experiência e o que está incluído" rows="5" [(ngModel)]="servePedido.detalhe" required></textarea></div>
    <div class="form-actions"><button class="button-primary" type="button" [disabled]="!f.valid" (click)="inscreverServico()">Cadastrar serviço</button><a class="button-secondary" [routerLink]="['/usuario', userId]">Cancelar</a></div>
  </form>
</div></main>
