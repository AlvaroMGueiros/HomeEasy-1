<app-navbar [authenticated]="entrarSair" [userId]="userId" (logout)="sair()"></app-navbar>
<main class="app-page"><div class="page-shell page-shell-narrow"><header class="page-heading"><div class="page-heading-copy"><span class="page-kicker">Serviço publicado</span><h1>{{ servico.nome }}</h1><p>Confira como esta oferta aparece para os clientes.</p></div></header><section class="surface-card"><div class="detail-list"><div class="detail-item"><span>Serviço</span><strong>{{ servico.nome }}</strong></div><div class="detail-item"><span>Valor</span><strong>R$ {{ servicoped.preco }}</strong></div><div class="detail-item field-group-full"><span>Descrição</span><strong>{{ servicoped.detalhe }}</strong></div></div><div class="form-actions" style="margin-top: 28px"><a class="button-primary" [routerLink]="['/serviços', userId, 'detalhe', servico.id, 'editar']">Editar serviço</a><a class="button-secondary" [routerLink]="['/serviços', userId]">Voltar</a></div></section></div></main>
